name: cd

on:
  push:
    branches: [main]

jobs:
  Deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: Set up Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Build app for prod
        run: ./scripts/buildprod.sh

      - name: Run DB migrations for prod
        run: ./scripts/migrateup.sh

      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v3"

      - name: "Use gcloud CLI"
        run: "gcloud builds submit --tag us-central1-docker.pkg.dev/celestial-tract-496800-h0/notely-ar-repo/notely:latest ."

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/celestial-tract-496800-h0/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project celestial-tract-496800-h0 --max-instances=4
